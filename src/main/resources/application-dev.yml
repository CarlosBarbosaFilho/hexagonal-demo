server:
  port: 8081
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:hexdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  mvc:
    problemdetails:
      enabled: true